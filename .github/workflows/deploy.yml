name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind + DaisyUI)
        run: npm run build

      - name: Assemble dist directory
        run: |
          mkdir -p dist/assets/css
          mkdir -p dist/assets/image
          mkdir -p dist/assets/cv
          mkdir -p dist/en

          # HTML pages
          cp src/index.html dist/index.html
          cp src/en/index.html dist/en/index.html

          # Static assets (images, CV, etc.)
          if [ -d "src/assets/image" ] && [ "$(ls -A src/assets/image 2>/dev/null)" ]; then
            cp -r src/assets/image/. dist/assets/image/
          fi
          if [ -d "src/assets/cv" ] && [ "$(ls -A src/assets/cv 2>/dev/null)" ]; then
            cp -r src/assets/cv/. dist/assets/cv/
          fi
          # Favicon (optional – add src/favicon.ico when available)
          if [ -f "src/favicon.ico" ]; then
            cp src/favicon.ico dist/favicon.ico
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
